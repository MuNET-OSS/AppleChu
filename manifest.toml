[mod]
id = "applesaber.applechu"
name = "AppleChu"
version = "1.0.0"
authors = ["Applesaber"]
description = { zh = "CHUNITHM Mod", en = "CHUNITHM Mod" }
homepage = "https://github.com/MuNET-OSS/AppleChu"
license = "Apache-2.0"
min_loader_version = "3.0.0"
game_versions = ["2.45"]

[ui]
groups = [
    { id = "common", label = { zh = "常用", en = "Common" }, sections = ["General", "SkipStartup", "FreePlay", "DisableTimer", "SkipMapAnimation"] },
    { id = "gameplay", label = { zh = "游戏", en = "Gameplay" }, sections = ["UnlockTracks", "CustomTimers", "AllTimers999", "Autoplay"] },
    { id = "display", label = { zh = "显示", en = "Display" }, sections = ["Unlock120fps", "Bypass1080p", "Bypass120hz", "DpiAware"] },
    { id = "audio", label = { zh = "音频", en = "Audio" }, sections = ["ForceSharedAudio", "Force2chAudio"] },
    { id = "network", label = { zh = "网络", en = "Network" }, sections = ["DisableEncryption", "DisableTLS"] },
    { id = "compatibility", label = { zh = "兼容", en = "Compatibility" }, sections = ["BypassAppUser"] },
    { id = "ux", label = { zh = "体验", en = "UX" }, sections = ["ExitConfirm", "DeviceLostFix"] },
]

[[config.sections]]
id = "General"
always_enabled = true
label = { zh = "通用设置", en = "General" }
    [[config.sections.entries]]
    key = "version_text"
    type = "string"
    default = ""
    label = { zh = "自定义版本号", en = "Custom version text" }

[[config.sections]]
id = "SkipStartup"
default_enabled = true
label = { zh = "跳过启动画面", en = "Skip startup" }

[[config.sections]]
id = "FreePlay"
default_enabled = true
label = { zh = "免费游玩", en = "Free play" }
    [[config.sections.entries]]
    key = "custom_text"
    type = "string"
    default = ""
    label = { zh = "自定义显示文本", en = "Custom display text" }

[[config.sections]]
id = "DisableTimer"
default_enabled = true
label = { zh = "禁用选歌计时器", en = "Disable song timer" }

[[config.sections]]
id = "SkipMapAnimation"
default_enabled = true
label = { zh = "跳过地图动画", en = "Skip map animation" }

[[config.sections]]
id = "UnlockTracks"
default_enabled = false
label = { zh = "解锁曲数上限", en = "Unlock track limit" }
    [[config.sections.entries]]
    key = "max"
    type = "int"
    default = 3
    min = 1
    max = 99
    label = { zh = "最大曲数", en = "Max tracks" }

[[config.sections]]
id = "CustomTimers"
default_enabled = false
label = { zh = "自定义计时器", en = "Custom timers" }
    [[config.sections.entries]]
    key = "map_select"
    type = "int"
    default = 60
    min = -128
    max = 127
    label = { zh = "地图选择", en = "Map select" }
    [[config.sections.entries]]
    key = "ticket_select"
    type = "int"
    default = 60
    min = -128
    max = 127
    label = { zh = "票券选择", en = "Ticket select" }
    [[config.sections.entries]]
    key = "course_select"
    type = "int"
    default = 60
    min = -128
    max = 127
    label = { zh = "课题选择", en = "Course select" }

[[config.sections]]
id = "AllTimers999"
default_enabled = false
label = { zh = "所有计时器 999", en = "All timers 999" }

[[config.sections]]
id = "Autoplay"
default_enabled = false
label = { zh = "自动游玩", en = "Autoplay" }
description = { zh = "只屏蔽成绩数据，角色/设置/地图进度正常保存", en = "Only blocks score data, settings/progress saved normally" }
    [[config.sections.entries]]
    key = "block_playlog"
    type = "bool"
    default = true
    label = { zh = "屏蔽游玩记录", en = "Block playlog" }
    [[config.sections.entries]]
    key = "block_music_detail"
    type = "bool"
    default = true
    label = { zh = "屏蔽成绩详情", en = "Block music detail" }

[[config.sections]]
id = "Unlock120fps"
default_enabled = true
label = { zh = "解锁 120fps", en = "Unlock 120fps" }
    [[config.sections.entries]]
    key = "force"
    type = "bool"
    default = true
    label = { zh = "强制 120fps", en = "Force 120fps" }

[[config.sections]]
id = "Bypass1080p"
default_enabled = false
label = { zh = "绕过 1080P 检测", en = "Bypass 1080p check" }

[[config.sections]]
id = "Bypass120hz"
default_enabled = false
label = { zh = "绕过 120Hz 检测", en = "Bypass 120Hz check" }

[[config.sections]]
id = "DpiAware"
default_enabled = true
label = { zh = "DPI 感知", en = "DPI awareness" }

[[config.sections]]
id = "ForceSharedAudio"
default_enabled = false
label = { zh = "强制共享音频", en = "Force shared audio" }
description = { zh = "系统采样率必须为 48000Hz，可能增加延迟", en = "System sample rate must be 48000Hz, may increase latency" }

[[config.sections]]
id = "Force2chAudio"
default_enabled = false
label = { zh = "强制双声道", en = "Force 2ch audio" }

[[config.sections]]
id = "DisableEncryption"
default_enabled = true
label = { zh = "关闭网络加密", en = "Disable encryption" }
description = { zh = "私服联网需要开启", en = "Required for private servers" }

[[config.sections]]
id = "DisableTLS"
default_enabled = true
label = { zh = "关闭 TLS", en = "Disable TLS" }

[[config.sections]]
id = "BypassAppUser"
default_enabled = false
label = { zh = "绕过 AppUser 检测", en = "Bypass AppUser check" }

[[config.sections]]
id = "ExitConfirm"
default_enabled = true
label = { zh = "退出确认对话框", en = "Exit confirmation dialog" }

[[config.sections]]
id = "DeviceLostFix"
default_enabled = true
label = { zh = "切换窗口闪退修复", en = "Device lost fix" }
description = { zh = "Alt+Tab 后防止游戏崩溃（后续版本实现）", en = "Prevent crash after Alt+Tab (planned)" }
