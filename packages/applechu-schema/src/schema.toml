[mod]
id = "applesaber.applechu"
name = "AppleChu"
version = "1.0.0"
authors = ["Applesaber"]
description = { zh = "CHUNITHM Mod", en = "CHUNITHM Mod" }
homepage = "https://github.com/MuNET-OSS/AppleChu"
license = "Apache-2.0"
min_loader_version = "1.0.0"
game_versions = ["2.45"]

[ui]
groups = [
    { id = "common", label = { zh = "常用", en = "Common" }, sections = ["Amdaemon", "System", "General", "SkipStartup", "FreePlay", "DisableTimer", "SkipMapAnimation"] },
    { id = "gameplay", label = { zh = "游戏", en = "Gameplay" }, sections = ["UnlockTracks", "CustomTimers", "Autoplay"] },
    { id = "display", label = { zh = "显示", en = "Display" }, sections = ["Window", "D3D9Ex", "Unlock120fps", "Bypass1080p", "Bypass120hz", "DpiAware", "FpsDisplay", "FrameLock"] },
    { id = "audio", label = { zh = "音频", en = "Audio" }, sections = ["ForceSharedAudio", "Force2chAudio"] },
    { id = "network", label = { zh = "网络", en = "Network" }, sections = ["DisableEncryption", "DisableTLS", "NetLog", "NationalMatch"] },
    { id = "io", label = { zh = "IO", en = "IO" }, sections = ["ChuniIo", "AimeIo", "Buttons", "Air", "Slider", "Led", "Io4", "Aime", "Led15093", "Vfd"] },
    { id = "compatibility", label = { zh = "兼容", en = "Compatibility" }, sections = ["BypassAppUser"] },
]

[[config.sections]]
id = "Amdaemon"
default_enabled = true
label = { zh = "AM Daemon", en = "AM Daemon" }
    [[config.sections.entries]]
    key = "AutoStart"
    type = "bool"
    default = false
    emit_default = true
    label = { zh = "由游戏侧启动 AM Daemon", en = "Start AM Daemon with the game" }
    [[config.sections.entries]]
    key = "Executable"
    type = "string"
    default = "amdaemon.exe"
    label = { zh = "可执行文件", en = "Executable" }
    [[config.sections.entries]]
    key = "HideWindow"
    type = "bool"
    default = false
    label = { zh = "隐藏控制台窗口", en = "Hide console window" }
    [[config.sections.entries]]
    key = "TerminateOnExit"
    type = "bool"
    default = true
    label = { zh = "退出时终止", en = "Terminate on exit" }
    [[config.sections.entries]]
    key = "AppendConfigArgs"
    type = "bool"
    default = false
    emit_default = true
    label = { zh = "补充 JSON 参数", en = "Append JSON arguments" }
