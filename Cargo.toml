[workspace]
members = [
    "packages/applechu",
    "packages/applechu-amdaemon",
    "packages/applechu-macros",
    "packages/applechu-schema",
    "packages/chu-abi",
]
default-members = ["packages/applechu"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
applechu-macros = { path = "packages/applechu-macros" }
applechu-schema = { path = "packages/applechu-schema" }
chu-abi = { path = "packages/chu-abi" }
forward-dll = "0.1.11"
linkme = "0.3.36"
once_cell = "1"
proc-macro2 = "1"
quote = "1"
retour = "0.4.0-alpha.4"
sha2 = "0.11"
syn = { version = "2", features = ["full"] }
toml = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
opt-level = "s"
